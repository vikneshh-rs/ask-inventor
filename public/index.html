<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASK INVENTORS — Interactive UI Demo</title>
<style>
:root{--navy:#101b35;--blue:#2458e8;--blue2:#3977ff;--ink:#17233c;--muted:#73809a;--line:#e5eaf3;--bg:#f4f7fc;--white:#fff;--green:#15966a;--amber:#c47b13;--red:#d64c59;--shadow:0 14px 40px rgba(24,43,84,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.5px;font-size:17px}.logo{height:36px;width:36px;border-radius:12px;background:linear-gradient(145deg,#153db9,#4e8dff);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 6px 15px #2458e833}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px;font-weight:700}.top-actions{display:flex;gap:10px;align-items:center}.demo-tag{background:#eef3ff;color:#2458e8;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:800}.avatar{height:34px;width:34px;border-radius:50%;background:#dce8ff;color:#2449a4;display:grid;place-items:center;font-weight:800}.layout{display:grid;grid-template-columns:252px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{padding:24px 15px;border-right:1px solid var(--line);background:#fbfcff;min-height:calc(100vh - 72px);position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.nav-label{font-size:10px;letter-spacing:1.4px;color:#98a2b5;font-weight:850;margin:19px 10px 8px}.nav-item{display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:10px;color:#64718a;font-weight:650;margin:3px 0;border:0;background:transparent;width:100%;text-align:left}.nav-item .ico{width:21px;text-align:center;font-size:16px}.nav-item:hover{background:#f0f4fc;color:var(--blue)}.nav-item.active{background:#eaf0ff;color:#1f4fd0;font-weight:800}.sidebar-foot{margin:28px 4px 0;padding:15px;background:#f0f4ff;border-radius:13px;color:#63718c;font-size:11px}.sidebar-foot strong{display:block;color:#2349b2;font-size:12px;margin-bottom:4px}.main{padding:28px clamp(18px,3vw,42px) 44px;min-width:0}.screen-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:850;color:var(--blue);text-transform:uppercase}.screen-head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-1.2px;line-height:1.15;margin:5px 0 8px}.screen-head p{margin:0;color:var(--muted);max-width:650px}.btn{border:1px solid var(--line);background:#fff;color:#34415d;padding:10px 14px;border-radius:10px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 15px #17233c12}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 15px #2458e82b}.btn.soft{background:#eef3ff;border-color:#eef3ff;color:#2458d8}.btn.small{font-size:12px;padding:7px 10px;border-radius:8px}.btn.danger{color:var(--red);border-color:#f4d7da;background:#fff8f8}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 4px 15px #192e5705;min-width:0}.panel h3{font-size:14px;margin:0 0 14px;letter-spacing:-.2px}.panel p{color:var(--muted)}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{height:34px;width:34px;border-radius:10px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-size:17px}.stat strong{font-size:27px;display:block;letter-spacing:-1px;margin:9px 0 2px}.trend{font-size:11px;color:var(--green)}.muted{color:var(--muted)}.smalltext{font-size:12px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.person{display:flex;gap:12px;align-items:center;min-width:0}.person .name{font-weight:800}.person .role{color:var(--muted);font-size:11px}.person-avatar{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#d9e6ff,#f2f6ff);color:#244bb3;font-weight:850;font-size:13px}.person-avatar.alt{background:linear-gradient(145deg,#ffe9d7,#fff5eb);color:#99592a}.person-avatar.purple{background:linear-gradient(145deg,#eadfff,#f8f3ff);color:#7043b5}.person-avatar.green{background:linear-gradient(145deg,#d7f5e9,#f1fff8);color:#16805c}.badge{font-size:10px;font-weight:850;border-radius:20px;padding:5px 8px;display:inline-block;background:#eef2f8;color:#68758b;white-space:nowrap}.badge.blue{background:#eaf0ff;color:#2856d8}.badge.green{background:#e5f8ef;color:#16815a}.badge.amber{background:#fff3db;color:#a46a0b}.badge.red{background:#ffebed;color:#bd3d4a}.divider{height:1px;background:var(--line);margin:15px 0}.list{display:grid;gap:13px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f6}.list-row:last-child{border-bottom:0;padding-bottom:0}.list-row:first-child{padding-top:0}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#53617b;font-weight:800}.field input,.field select,.field textarea,.search{border:1px solid #dfe5f0;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#7da0ff;box-shadow:0 0 0 3px #2458e815}.field textarea{min-height:88px;resize:vertical}.searchbar{display:flex;gap:9px;margin-bottom:16px}.searchbar .search{flex:1}.tabs{display:flex;gap:5px;flex-wrap:wrap;background:#f3f6fb;padding:5px;border-radius:10px;margin-bottom:16px;width:max-content;max-width:100%}.tab{border:0;background:transparent;padding:8px 12px;border-radius:7px;color:#75819a;font-size:12px;font-weight:800}.tab.active{background:#fff;color:#2458d8;box-shadow:0 2px 7px #17233c0b}.hero{border-radius:22px;padding:clamp(24px,4vw,48px);background:linear-gradient(120deg,#f7f9ff 0%,#e9f0ff 55%,#dbe8ff 100%);position:relative;overflow:hidden;min-height:300px;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;background:#fff8;right:12%;top:-125px;filter:blur(1px)}.hero h2{font-size:clamp(32px,4.5vw,52px);line-height:1.03;letter-spacing:-2px;margin:12px 0 15px;max-width:530px}.hero h2 span{color:var(--blue)}.hero p{color:#5d6b87;max-width:470px;line-height:1.7}.hero-art{position:relative;z-index:1;min-height:200px;display:grid;place-items:center}.orb{width:min(270px,100%);aspect-ratio:1;border-radius:42% 58% 58% 42%;background:linear-gradient(145deg,#c4d8ff,#fff 48%,#a8c4ff);box-shadow:inset -18px -20px 40px #2458e81a,0 25px 60px #2458e82b;display:grid;place-items:center;transform:rotate(-8deg)}.orb-inner{transform:rotate(8deg);width:64%;height:64%;border-radius:28px;background:#fff;box-shadow:0 15px 40px #1c3c821c;display:grid;place-items:center;font-size:54px}.service-icon{height:42px;width:42px;display:grid;place-items:center;border-radius:13px;background:#edf2ff;color:#2759df;font-size:20px;margin-bottom:13px}.service-card{padding:20px;min-height:170px}.service-card h3{margin:0 0 7px}.service-card p{font-size:12px;line-height:1.6;margin:0 0 12px}.service-card a{font-size:12px;color:var(--blue);font-weight:800}.mentor-card{padding:16px}.mentor-card .person-avatar{width:58px;height:58px;flex-basis:58px;border-radius:17px;font-size:17px}.stars{color:#e9a22c;font-size:12px;font-weight:850}.cover{height:100px;border-radius:12px;background:linear-gradient(135deg,#dce8ff,#f3f6ff 55%,#d4e2ff);margin-bottom:14px;display:grid;place-items:center;font-size:35px}.progress{height:7px;background:#edf1f7;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#2458e8,#73a2ff);border-radius:20px}.stepper{display:flex;gap:8px;margin:15px 0 22px}.step{height:28px;width:28px;border-radius:50%;display:grid;place-items:center;background:#edf1f8;color:#78859b;font-weight:800;font-size:11px}.step.active{background:var(--blue);color:#fff}.step.done{background:#e0f6ed;color:var(--green)}.auth-wrap{max-width:740px;margin:0 auto}.auth-card{max-width:550px;margin:0 auto;padding:30px}.role-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.role-option{border:1px solid var(--line);border-radius:13px;padding:18px;text-align:left;background:#fff}.role-option.selected{border:1.5px solid var(--blue);background:#f5f8ff;box-shadow:0 0 0 3px #2458e80b}.role-option .bigico{font-size:26px;margin-bottom:10px}.role-option strong{display:block;margin-bottom:4px}.role-option small{color:var(--muted);line-height:1.5}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8b96a9;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #edf0f6;font-size:12px}.table tr:last-child td{border-bottom:0}.table-wrap{overflow:auto}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative;padding-bottom:19px}.timeline-item:not(:last-child):before{content:"";position:absolute;left:9px;top:21px;bottom:0;width:2px;background:#e5eaf3}.dot{width:20px;height:20px;border-radius:50%;background:#e4f7ee;color:#16845d;display:grid;place-items:center;font-size:11px;z-index:1}.dot.pending{background:#edf2ff;color:#2458e8}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.calendar div{padding:9px 0;border-radius:8px;font-size:11px}.calendar .day{color:#96a0b1;font-weight:800}.calendar .selected{background:var(--blue);color:#fff;font-weight:800}.calendar .event{background:#eaf0ff;color:#2458d8;font-weight:800}.message{max-width:80%;padding:11px 13px;border-radius:13px;font-size:12px;margin:10px 0}.message.in{background:#f1f4fa;border-top-left-radius:4px}.message.out{background:#e9f0ff;color:#214bbf;margin-left:auto;border-top-right-radius:4px}.chatbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px}.chatbox input{border:0;outline:0;flex:1;min-width:0}.empty{padding:35px;text-align:center;color:var(--muted)}.empty .big{font-size:34px;margin-bottom:10px}.toast{position:fixed;bottom:22px;right:22px;background:#14213d;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.public-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px}.public-links{display:flex;gap:17px;color:#5d6b85;font-size:12px;font-weight:750}.callout{padding:16px;border-radius:12px;background:#f2f6ff;color:#536584;font-size:12px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 13px}.section-title h2{font-size:16px;margin:0}.kpi-line{display:flex;align-items:center;gap:4px;margin-top:8px}.bar{height:7px;background:#edf1f7;border-radius:20px;flex:1;overflow:hidden}.bar span{height:100%;display:block;background:#4f7cf3;border-radius:20px}.footer-note{font-size:11px;color:#96a0b2;text-align:center;margin-top:30px}.hide{display:none!important}
@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr .65fr}.public-links{gap:8px}}
@media(max-width:720px){.topbar{padding:0 15px}.layout{display:block}.sidebar{position:sticky;top:72px;z-index:9;height:auto;min-height:0;padding:8px 12px;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:4px}.nav-label,.sidebar-foot{display:none}.nav-item{width:auto;white-space:nowrap;padding:9px 12px;margin:0;font-size:12px}.nav-item .ico{display:none}.main{padding:20px 14px 35px}.screen-head{display:block}.screen-head>.btn{margin-top:14px}.g2,.g3,.g4{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:24px}.hero-art{display:none}.hero h2{font-size:37px}.public-links{display:none}.auth-card{padding:20px}.role-choice{grid-template-columns:1fr 1fr}.panel{padding:16px}.table{min-width:620px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">A</div><div>ASK INVENTORS<small>FROM PROJECT TO INNOVATION</small></div></div>
  <div class="top-actions"><span class="demo-tag">INTERACTIVE CONCEPT DEMO</span><button class="btn small" onclick="showToast('This is a sample UI. No real data is submitted.')">ⓘ Demo mode</button><div class="avatar">AI</div></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main"></main>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const groups=[
 {label:'PUBLIC WEBSITE',items:[['home','⌂','Homepage'],['services','▦','Our Services'],['mentors','♙','Mentor Directory'],['about','◈','About ASK INVENTORS'],['contact','✉','Contact Us']]},
 {label:'AUTHENTICATION & ONBOARDING',items:[['role','◉','Choose Your Role'],['signup','＋','Create Account'],['otp','✳','Verify Email'],['studentProfile','♧','Student Profile Setup'],['mentorProfile','♙','Mentor Profile Setup'],['complete','✓','Setup Complete'],['login','↪','Sign In']]},
 {label:'STUDENT PORTAL',items:[['studentDash','⌂','Student Dashboard'],['findMentor','⌕','Find a Mentor'],['request','＋','Request Mentoring'],['myRequests','☷','My Requests'],['project','▤','Project Workspace']]},
 {label:'MENTOR PORTAL',items:[['mentorDash','⌂','Mentor Dashboard'],['reviewRequest','☷','Review Request'],['myProjects','▤','My Projects'],['schedule','▦','Schedule'],['messages','✉','Messages']]},
 {label:'PLATFORM ADMIN',items:[['admin','⚙','Admin Overview'],['users','♙','User Management'],['verification','✓','Mentor Verification'],['reports','▥','Reports & Analytics']]}
];
const titles={
home:['Public website','From Project to Career. From Idea to Innovation.','A connected ecosystem for students, mentors and innovators.'],
services:['Public website','Services built around your innovation journey','One platform to help turn curiosity into capability and ideas into outcomes.'],
mentors:['Public website','Meet your next mentor','Learn from professionals, researchers and industry experts.'],
about:['Public website','Building a stronger innovation ecosystem','Connecting talent, knowledge and opportunity to create meaningful outcomes.'],
contact:['Public website','Let’s build something meaningful','Have a question, partnership idea or program in mind? We would love to hear from you.'],
role:['Onboarding','Choose your path','Tell us how you want to participate in the ASK INVENTORS community.'],
signup:['Authentication','Create your account','Start your innovation journey with a secure account.'],
otp:['Authentication','Verify your email','Enter the verification code to continue.'],
studentProfile:['Onboarding','Build your student profile','Help us personalize your experience and recommend relevant mentors.'],
mentorProfile:['Onboarding','Create your mentor profile','Share your expertise and how you would like to support the next generation.'],
complete:['Onboarding','You’re all set','Your profile setup is complete. Welcome to the community.'],
login:['Authentication','Welcome back','Sign in to continue where you left off.'],
studentDash:['Student portal','Welcome back, Vikram 👋','Here’s what is happening across your innovation journey.'],
findMentor:['Student portal','Find the right mentor','Discover experts who can help move your project forward.'],
request:['Student portal','Request mentoring','Share your requirements so the right mentor can understand your needs.'],
myRequests:['Student portal','My mentoring requests','Track the status of your requests and next steps.'],
project:['Student portal','IoT Based Energy Monitoring System','One shared workspace to coordinate milestones, files and discussions.'],
mentorDash:['Mentor portal','Welcome back, Dr. Priya 👋','Your mentoring activity and upcoming priorities at a glance.'],
reviewRequest:['Mentor portal','Review mentorship request','Understand the student’s goals before making a decision.'],
myProjects:['Mentor portal','My projects','Manage ongoing and completed mentoring engagements.'],
schedule:['Mentor portal','Your schedule','Plan sessions and manage your mentoring availability.'],
messages:['Mentor portal','Messages','Keep project communication and decisions in one place.'],
admin:['Platform administration','Platform overview','Monitor activity, review important actions and support a healthy community.'],
users:['Platform administration','User management','Review platform accounts and manage user access.'],
verification:['Platform administration','Mentor verification','Review mentor credentials before approving their public profile.'],
reports:['Platform administration','Reports & analytics','Understand platform activity and where the community needs support.']
};
let current='home';
function nav(){document.getElementById('sidebar').innerHTML=groups.map(g=>`<div class="nav-label">${g.label}</div>${g.items.map(([id,ic,n])=>`<button class="nav-item ${id===current?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${n}</button>`).join('')}`).join('')+`<div class="sidebar-foot"><strong>ASK INVENTORS</strong>Concept walkthrough · Sample data only<br><br>Built to demonstrate the proposed user journeys.</div>`}
function head(id){let t=titles[id];return `<div class="screen-head"><div><div class="eyebrow">${t[0]}</div><h1>${t[1]}</h1><p>${t[2]}</p></div>${['home','services','mentors','about','contact','role','signup','otp','studentProfile','mentorProfile','complete','login'].includes(id)?`<button class="btn" onclick="go('studentDash')">Preview portal ↗</button>`:`<button class="btn" onclick="showToast('Sample interaction — no backend is connected.')">＋ Quick action</button>`}</div>`}
function panel(title,body,extra=''){return `<section class="panel ${extra}"><h3>${title}</h3>${body}</section>`}
function stat(label,value,icon,trend){return `<div class="panel stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><span class="trend">${trend}</span></div>`}
function person(initials,name,role,cls=''){return `<div class="person"><div class="person-avatar ${cls}">${initials}</div><div><div class="name">${name}</div><div class="role">${role}</div></div></div>`}
function badge(text,type='blue'){return `<span class="badge ${type}">${text}</span>`}
function serviceCards(){let a=[['⌘','Project Mentoring & Guidance','Get expert support from planning to final presentation.'],['▤','Skills Development','Build practical skills through guided learning and workshops.'],['⌕','Research Support','Strengthen your research question, methodology and outcomes.'],['⚙','Prototype Development','Turn concepts into tested prototypes and proof-of-concepts.'],['↗','Career Guidance','Build your portfolio and prepare for career opportunities.'],['♧','Entrepreneurship & Innovation','Validate ideas and explore the path from problem to startup.']];return `<div class="grid g3">${a.map((x,i)=>`<div class="panel service-card"><div class="service-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><a href="#" onclick="go('${i===0?'request':'contact'}');return false">Explore service ↗</a></div>`).join('')}</div>`}
function mentorCards(){let arr=[['PS','Dr. Priya Sharma','Embedded Systems · IoT','IIT Delhi','4.9','Available'],['RM','Prof. R. K. Menon','Research & Innovation','Research Faculty','4.8','Limited slots'],['AM','Arjun Mehta','Product Development','Industry Mentor','4.9','Available']];return `<div class="grid g3">${arr.map((m,i)=>`<div class="panel mentor-card"><div class="cover">${['⌘','⚗','⚙'][i]}</div>${person(m[0],m[1],m[2],i===1?'alt':i===2?'purple':'')}<p class="smalltext muted">${m[3]}</p><div class="row between"><span class="stars">★ ${m[4]} <span class="muted">(reviews)</span></span>${badge(m[5],i===1?'amber':'green')}</div><div class="divider"></div><button class="btn primary small" style="width:100%" onclick="go('request')">Request mentoring</button></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function formField(label,placeholder,type='text'){return `<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}"></div>`}
function home(){return `<div class="public-nav"><div class="brand"><div class="logo">A</div><div>ASK INVENTORS</div></div><div class="public-links"><span onclick="go('services')">Services</span><span onclick="go('mentors')">Mentors</span><span onclick="go('about')">About</span><span onclick="go('contact')">Contact</span></div><div class="row"><button class="btn small" onclick="go('login')">Sign in</button><button class="btn primary small" onclick="go('role')">Get started</button></div></div>
<div class="hero"><div><span class="badge blue">YOUR INNOVATION JOURNEY STARTS HERE</span><h2>From Project to Career.<br>From Idea to <span>Innovation.</span></h2><p>A connected platform that brings students, mentors, research and real-world opportunities together — helping every good idea find its next step.</p><div class="row wrap" style="margin-top:20px"><button class="btn primary" onclick="go('role')">Start your journey →</button><button class="btn" onclick="go('services')">Explore services</button></div><div class="row wrap" style="margin-top:26px;gap:25px"><div><strong style="font-size:21px">6</strong><div class="muted smalltext">Core services</div></div><div><strong style="font-size:21px">1</strong><div class="muted smalltext">Connected journey</div></div><div><strong style="font-size:21px">4</strong><div class="muted smalltext">Audience groups</div></div></div></div><div class="hero-art"><div class="orb"><div class="orb-inner">⚙</div></div></div></div>
<div class="section-title"><h2>Everything you need to move forward</h2><button class="btn small" onclick="go('services')">View all services →</button></div>${serviceCards()}
<div class="section-title"><h2>Guidance from people who have been there</h2><button class="btn small" onclick="go('mentors')">Meet mentors →</button></div>${mentorCards()}

function schedule(){return `<div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr)"><div class="panel"><div class="row between"><h3>October 2026</h3><div class="row"><button class="btn small" onclick="showToast('Previous month preview.')">‹</button><button class="btn small" onclick="showToast('Next month preview.')">›</button></div></div><div class="calendar" style="margin-top:20px">${['M','T','W','T','F','S','S'].map(x=>`<div class="day">${x}</div>`).join('')}${Array.from({length:35},(_,i)=>{let d=i-2;return `<div class="${d===29?'selected':([9,16,23,30].includes(d)?'event':'')}">${d>0&&d<=31?d:''}</div>`}).join('')}</div><div class="divider"></div><div class="row wrap"><span class="badge blue">● Selected day</span><span class="badge" style="background:#eaf0ff;color:#2458d8">● Session scheduled</span></div></div><div class="panel"><div class="row between"><h3>Upcoming sessions</h3><button class="btn primary small" onclick="showToast('Demo: schedule session form opened.')">＋ Add session</button></div><div class="list"><div class="list-row"><div><strong>Project review — Vikram S.</strong><div class="smalltext muted">10:00–10:45 AM · Online</div></div>${badge('Today','blue')}</div><div class="list-row"><div><strong>Research check-in — Ananya N.</strong><div class="smalltext muted">2:00–2:30 PM · Online</div></div>${badge('Today','blue')}</div><div class="list-row"><div><strong>Prototype feedback — Rahul K.</strong><div class="smalltext muted">Friday · 11:00 AM</div></div>${badge('Upcoming','green')}</div></div></div></div>`}
function messages(){return `<div class="grid" style="grid-template-columns:minmax(220px,.75fr) minmax(0,1.5fr)"><div class="panel"><h3>Conversations</h3><div class="list"><div class="list-row" style="background:#f3f6ff;margin:0 -8px;padding:10px 8px;border-radius:9px">${person('VK','Vikram S.','IoT Energy Monitoring')}</div><div class="list-row">${person('AN','Ananya N.','Smart Agriculture','alt')}</div><div class="list-row">${person('RK','Rahul K.','Research check-in','purple')}</div></div></div><div class="panel"><div class="row between">${person('VK','Vikram S.','Project discussion')}<span class="badge green">Active</span></div><div class="divider"></div><div style="min-height:260px;display:flex;flex-direction:column"><div class="message in">Hi Dr. Priya, I have completed the initial sensor readings. Could you review the data format?</div><div class="message out">Great progress. Please share the sample readings and note the sampling interval.</div><div class="message in">Sure, I’ve added the readings to the project files. The interval is currently one second.</div><div class="message out">That works for the first test. Let’s review the noise and calibration next.</div></div><div class="chatbox"><input id="chatInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn primary small" onclick="sendMessage()">Send ↑</button></div><p class="smalltext muted">Sample conversation for UI demonstration only.</p></div></div>`}
function admin(){return `<div class="grid g4">${stat('Total users','2,500','♙','Across account types')}${stat('Pending mentors','12','✓','Require review')}${stat('Active projects','200','▤','Across the platform')}${stat('Programs','50','▦','Workshops & cohorts')}</div><div class="grid g2" style="margin-top:17px"><div class="panel"><h3>Platform activity</h3><div style="display:flex;align-items:end;gap:12px;height:150px;padding:12px 4px 0">${[42,66,53,76,60,88,72,95,68,84,75,100].map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v}%;min-height:12px;background:linear-gradient(180deg,#6b94ff,#2458e8);border-radius:5px 5px 2px 2px"></div></div>`).join('')}</div><div class="row between smalltext muted"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></div><div class="panel"><div class="row between"><h3>Needs attention</h3><span class="badge amber">12 pending</span></div><div class="list"><div class="list-row"><span>Mentor profiles awaiting review</span><button class="btn small" onclick="go('verification')">Review</button></div><div class="list-row"><span>New user reports</span><button class="btn small" onclick="go('reports')">View</button></div><div class="list-row"><span>Recently registered users</span><button class="btn small" onclick="go('users')">Manage</button></div></div></div></div><div class="section-title"><h2>Recent platform activity</h2><button class="btn small" onclick="go('reports')">View reports →</button></div>${panel('Activity log',table(['EVENT','CATEGORY','TIME','STATUS'],[['New student registration','Accounts','12 min ago',badge('Complete','green')],['Mentor profile submitted','Verification','1 hour ago',badge('Pending','amber')],['Project marked complete','Projects','3 hours ago',badge('Complete','green')],['Program content updated','Services','Yesterday',badge('Complete','green')]]))}`}
function users(){return `${panel('Directory filters',`<div class="searchbar"><input class="search" placeholder="Search name, email or user ID"><select class="search" style="max-width:160px"><option>All roles</option><option>Student</option><option>Mentor</option><option>Institution</option></select><select class="search" style="max-width:150px"><option>All statuses</option><option>Active</option><option>Pending</option></select><button class="btn primary" onclick="showToast('Demo user filters applied.')">Apply</button></div>`)}${panel('Users',table(['USER','ROLE','JOINED','STATUS','ACTIONS'],[['Vikram S.','Student','Oct 29, 2026',badge('Active','green'),'<button class="btn small" onclick="showToast(&quot;Demo user profile opened.&quot;)">View</button>'],['Dr. Priya Sharma','Mentor','Oct 25, 2026',badge('Active','green'),'<button class="btn small" onclick="showToast(&quot;Demo user profile opened.&quot;)">View</button>'],['Arjun Mehta','Mentor','Oct 22, 2026',badge('Pending','amber'),'<button class="btn small" onclick="go(&quot;verification&quot;)">Review</button>'],['Sample Institute','Institution','Oct 18, 2026',badge('Pending','amber'),'<button class="btn small" onclick="showToast(&quot;Demo institution record opened.&quot;)">View</button>']]))}` }
function verification(){return `<div class="callout" style="margin-bottom:16px">Mentor profiles should be reviewed before publication. Confirm identity, qualifications and experience according to the platform’s verification policy.</div>${panel('Pending verification queue',table(['MENTOR','EXPERTISE','EVIDENCE','SUBMITTED','STATUS',''],[['Arjun Mehta','Product Development','Portfolio + experience','Oct 28',badge('Pending','amber'),'<button class="btn primary small" onclick="reviewAction(this)">Review</button>'],['Dr. Priya Sharma','Embedded Systems','Institution + profile','Oct 27',badge('Approved','green'),'<button class="btn small" onclick="showToast(&quot;Profile details opened.&quot;)">View</button>'],['Prof. R. K. Menon','Research','Credentials uploaded','Oct 26',badge('Pending','amber'),'<button class="btn primary small" onclick="reviewAction(this)">Review</button>'],['Meera Iyer','Robotics','Experience to confirm','Oct 25',badge('Needs info','red'),'<button class="btn small" onclick="reviewAction(this)">Review</button>']]))}<div class="smalltext muted" style="margin-top:12px">Approvals in this prototype only update the demo interface.</div>`}
function reports(){return `<div class="grid g4">${stat('New registrations','184','♙','This month')}${stat('Mentoring requests','76','☷','This month')}${stat('Projects completed','32','✓','This month')}${stat('Avg. response time','1.8d','◷','Illustrative KPI')}</div><div class="grid g2" style="margin-top:17px"><div class="panel"><h3>Journey funnel</h3>${[['Account created',100],['Profile completed',82],['Mentoring request',56],['Mentor matched',42],['Project completed',21]].map(x=>`<div style="margin:15px 0"><div class="row between smalltext"><span>${x[0]}</span><strong>${x[1]}%</strong></div><div class="progress" style="margin-top:7px"><span style="width:${x[1]}%"></span></div></div>`).join('')}</div><div class="panel"><h3>Service demand</h3>${[['Project mentoring',78],['Research support',62],['Skills development',53],['Prototype development',45],['Career guidance',39]].map(x=>`<div style="margin:15px 0"><div class="row between smalltext"><span>${x[0]}</span><strong>${x[1]}</strong></div><div class="progress" style="margin-top:7px"><span style="width:${x[1]}%"></span></div></div>`).join('')}</div></div><div class="callout" style="margin-top:16px">All figures are fictional sample data to demonstrate reporting layout, not actual ASK INVENTORS analytics.</div>`}
const renderers={home,services,mentors,about,contact,role,signup,otp,studentProfile,mentorProfile,complete,login,studentDash,findMentor,request,myRequests,project,mentorDash,reviewRequest,myProjects,schedule,messages,admin,users,verification,reports};
function go(id){current=id;nav();document.getElementById('main').innerHTML=head(id)+(renderers[id]||home)();window.scrollTo({top:0,behavior:'smooth'})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function selectRole(el){document.querySelectorAll('.role-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function setTab(el){let p=el.parentElement;p.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');showToast('Selected: '+el.textContent.trim())}
function sendMessage(){let i=document.getElementById('chatInput');if(i&&i.value.trim()){const msg=document.createElement('div');msg.className='message out';msg.textContent=i.value.trim();i.closest('.panel').querySelector('.chatbox').before(msg);i.value='';showToast('Demo message added locally.')}}
function reviewAction(el){el.textContent='Reviewed';el.classList.remove('primary');el.disabled=true;showToast('Demo review opened. No real approval was recorded.')}
go('home');
</script>
